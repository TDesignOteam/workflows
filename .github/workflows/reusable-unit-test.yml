name: reusable-unit-test
on:
  workflow_call:
    inputs:
      skip-site:
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: '22'
      node-version-file:
        required: false
        type: string
        default: ''
      package-manager:
        required: false
        type: string
        default: npm

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - uses: TDesignOteam/workflows/actions/check-email@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - run: ${{ inputs.package-manager }} run lint
      - run: ${{ inputs.package-manager }} run test
      # upload report to codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  site:
    if: ${{ !inputs.skip-site }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - name: Build site
        run: ${{ inputs.package-manager }} run site:preview

      - run: |
          zip -r _site.zip _site

      - name: upload _site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr
          path: ./pr-id.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - name: Build
        run: ${{ inputs.package-manager }} run build
