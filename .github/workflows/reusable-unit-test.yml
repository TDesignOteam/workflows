name: reusable-unit-test
on:
  workflow_call:
    inputs:
      skip-site:
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: '22'
      node-version-file:
        required: false
        type: string
        default: ''
      package-manager:
        required: false
        type: string
        default: npm

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - uses: TDesignOteam/workflows/actions/check-email@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - run: ${{ inputs.package-manager }} run lint
      - run: ${{ inputs.package-manager }} run test
      # upload report to codecov
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  site:
    if: ${{ !inputs.skip-site }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - name: Build site
        run: ${{ inputs.package-manager }} run site:preview

      - run: |
          zip -r _site.zip _site

      - name: upload _site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _site
          path: _site.zip
          retention-days: 5

      - name: Save PR number
        if: ${{ always() }}
        run: echo ${{ github.event.number }} > ./pr-id.txt

      - name: Upload PR number
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr
          path: ./pr-id.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.package-manager == 'pnpm' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || null }}
          node-version-file: ${{ inputs.node-version-file != '' && inputs.node-version-file || null }}

      - run: ${{ inputs.package-manager }} install

      - name: Build
        run: ${{ inputs.package-manager }} run build
