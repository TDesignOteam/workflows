catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - why-is-node-running@3.2.2

shellEmulator: true

packages:
  - actions/*
  - packages/*

catalog:
  '@actions/core': ^3.0.1
  '@actions/exec': ^3.0.0
  '@actions/github': ^9.1.1
  '@antfu/eslint-config': ^9.5.1
  '@octokit/plugin-rest-endpoint-methods': ^18.0.0
  '@types/node': ^24.19.0
  '@typescript/native-preview': 7.0.0-dev.20260707.2
  eslint: ^10.11.0
  jsonc-parser: ^3.3.1
  tsdown: ^0.23.0
  vitest: ^5.0.2
  yaml: ^2.9.1
